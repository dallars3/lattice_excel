    <title>协作多维表格</title>
    <script>
      // 主题预置（纸墨 Paper·Ink）：先于首帧读持久化/系统偏好挂 data-theme，避免暗色闪烁；
      // 运行时切换由 themeStore（stores/theme.ts）接管，同键 ui-theme。
      ;(function () {
        try {
          var stored = localStorage.getItem('ui-theme')
          if (
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.dataset.theme = 'dark'
          }
        } catch (e) {
          /* 隐私模式等场景忽略，走亮色 */
        }
      })()
    </script>
